name: home_cameras
description: Local-network camera viewing for Android TV.
publish_to: none
version: 0.1.2+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  easy_onvif: 3.1.5
  dio: ^5.9.0
  loggy: ^2.0.3
  xml: 7.0.1
  flutter_secure_storage: 11.1.1
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: 1.3.3

flutter:
  uses-material-design: true
